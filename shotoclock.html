  if (!tcp || tcp.off) return '';   // bridge switched off in Code.gs: show nothing
  if (!tcp || !tcp.enabled) return `<div class="card"><h3>TCP Bridge</h3><div class="d">Not set up yet. Run setupBridge in the script editor and install the Chrome extension on the base laptop.</div></div>`;
  if (Date.now() - bridgeAsked > 10000) { bridgeAsked = Date.now(); call('api_bridgeStatus').then(r => { const was = bridgeSeen; bridgeSeen = (r && r.lastSeen) || ''; if (was !== bridgeSeen && S.settingsOpen) renderSettings(V()); }).catch(() => {}); }
  const live = bridgeSeen && Date.now() - new Date(bridgeSeen) < 30000;
  const probs = (tcp.problems || []).map(p => `<div class="tr"><span>${esc(p.name)} · ${esc(p.button)} · ${fmtDT(p.time)}<br><small>${esc(p.detail)}</small></span><b style="color:var(--red)">${esc(p.status)}</b></div>`).join('');
  return `<div class="card"><h3>TCP Bridge</h3>
    <div class="v" style="color:var(--${live ? 'green' : 'red'})">${live ? 'Connected' : 'Not connected'}</div>
    <div class="d">${live ? 'The base laptop is sending punches to TCP.' : 'Open the TCP webclock tab on the base laptop with the extension on.'} Last seen ${bridgeSeen ? fmtDT(bridgeSeen) : 'never'}.<br>Waiting: ${tcp.pending + tcp.sending} · Sent: ${tcp.done} · Need attention: ${(tcp.problems || []).length}</div>
    ${probs ? `<div class="times" style="margin-top:12px">${probs}</div><div class="d" style="margin-top:8px">Fix these in TCP by hand. They will not be resent.</div>` : ''}</div>`;
}
/** Show days: which day the app is on. Switching hides the other day's sheets (radios and scanners must be at base). */
function daysCard(st) {
  const days = st.days || [];
  if (!days.length) return '';
  return `<div class="card"><h3>Show day</h3><div class="d">The app follows the date (before noon counts as the night before). Switching day hides the other days' sheets. Every radio and scanner has to be back at base first.</div>
    <div class="seg days">${days.map((d, i) => `<button class="${d.key === st.activeDay ? 'on' : ''}" data-day="${esc(d.key)}"><small>Day ${i + 1}</small><br>${esc(d.label)}</button>`).join('')}</div>
    ${st.dayBlocked ? `<div class="err" style="text-align:left">${esc(st.dayBlocked)}</div>` : ''}</div>`;
}
/** Close Out: only on the last day of the show. */
function closeOutBtn(st) {
  const days = st.days || [];
  if (st.closedOut) return `<div class="card"><h3>Closed out</h3><div class="d">This show is closed out. Only its day timesheets are showing in the Shot O'clock sheet. Tap Refresh Roster when the next show is on the Master Timesheet.</div></div>`;
  if (!days.length || st.activeDay !== days[days.length - 1].key) return '';
  return `<button class="bigset dark" data-sact="closeout">${I.check}<div><div class="a">Close Out ${esc((st.event || {}).name || 'show')}</div><div class="b">Last day of the show. Hides every sheet except the day timesheets (${days.map(d => esc(d.label)).join(', ')}). Radios and scanners must be back at base.</div></div></button>`;
}
function renderSettings(st) {
  const ev = st.event || {}, set = st.settings || {};
  const mb = set.maxBreaksOverride || '';
  const tabs = set.scheduleTabs || [];
  const when = iso => iso ? new Date(iso).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : 'never';
  $('#setView').innerHTML = `<div class="set">
    ${IN_ONSITE ? `<button class="bigset dark" data-sact="onsite">${I.back}<div><div class="a">Return to OnSite</div><div class="b">Back to the OnSite home screen (Sell, Scan, Flag). Everything here keeps syncing to the Shot O'clock sheet.</div></div></button>` : ''}
    <div class="card"><h3>Current event</h3><div class="v">${esc(ev.name || 'None loaded')}</div>
      <div class="d">Roster tab: ${esc(ev.tab || '-')} · ${st.people.length} staff<br>Schedule tab: ${esc(ev.scheduleTab || '-')} · ${st.pairs.filter(p => p.kind !== 'lead').length} teams<br>Roster refreshed ${when(ev.rosterRefreshedAt)}</div></div>
    ${daysCard(st)}
    <button class="bigset blue" data-sact="schedule">${I.map}<div><div class="a">Refresh Partners</div><div class="b">Re-reads who is partnered with who from the Master Timesheet schedule. Use it whenever partners change during the night. Teams that did not change stay where they are; any team with a new partner goes back to Available.</div></div></button>
    <button class="bigset purple" data-sact="signout">${I.outIcon}<div><div class="a">Send Sign Out Sheet</div><div class="b">Makes tonight's sign out sheet (Excel: times, durations and a signature line for everyone who clocked in) and emails it to Aria and Gabriel to print.</div></div></button>
    ${closeOutBtn(st)}
    <div class="card"><h3>Breaks per shift</h3><div class="d">Auto reads the schedule: two sets of Break A/B means 2 breaks. Currently ${st.maxBreaks}.</div>
      <div class="seg">${[['','Auto'],['1','1 break'],['2','2 breaks']].map(([v, l]) => `<button class="${mb === v ? 'on' : ''}" data-mb="${v}">${l}</button>`).join('')}</div></div>
    <div class="card"><h3>Schedule tab</h3><div class="d">Auto picks the visible tab for tonight (after midnight counts as the night before).</div>
      <select class="sel2" id="schedSel"><option value="">Auto</option>${tabs.map(t => `<option ${set.scheduleTabOverride === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
    ${(st.unmatched || []).length ? `<div class="card"><h3>Break rings</h3><div class="d">These schedule names don't match exactly one person on the roster, so they get no break ring and don't move to Available on break: <b>${st.unmatched.map(esc).join(', ')}</b>.<br>Fix: in the schedule, use the roster's first name, or add a last initial (like "Chance B"), then Refresh Placements.</div></div>` : ''}
    ${tcpCard(st.tcp)}
    <div class="card"><h3>Sync</h3><div class="d">${S.online ? 'Online.' : 'Offline. Punches are saved on this device and sync automatically.'} ${S.pending.length ? S.pending.length + ' change(s) waiting to sync.' : 'Everything is synced.'}</div>
      <div class="links"><a href="${esc(st.dataUrl || '#')}" target="_blank" rel="noopener">Open Shot O'clock sheet</a><a href="${esc(st.masterUrl || '#')}" target="_blank" rel="noopener">Open Master Timesheet</a></div></div>
    <button class="pbtn" style="align-self:center" data-sact="clear">Clear all placements</button>
    <button class="pbtn" style="align-self:center" data-sact="radiobase">${I.radio}Return all radios to base</button>
    <button class="pbtn" style="align-self:center" data-sact="scannerbase">${I.scan}Return all scanners to base</button>
    <button class="bigset red" data-sact="roster">${I.refresh}<div><div class="a">Refresh Roster</div><div class="b">Re-pulls the latest show roster from the Master Timesheet. If a newer show is there, the app switches over to it and hides the old show's sheets.</div></div></button>
  </div>`;
}
document.addEventListener('click', async e => {
  if (!S.settingsOpen) return;
  const a = e.target.closest('[data-sact]');
  if (a) {
    if (a.dataset.sact === 'onsite') return returnToOnsite();
    if (a.dataset.sact === 'roster' && confirm('Are you sure?\n\nThis re-pulls the latest show roster from the Master Timesheet. If there is a more current event, the app will switch over to that event and hide the current show\'s sheets.'))
      runRefresh('api_refreshRoster', 'Pulling the roster from the Master Timesheet…');
    if (a.dataset.sact === 'signout' && confirm('Are you ready to print out your Sign Out sheet for the night?\n\nIt will be emailed to Aria and Gabriel as an Excel file.'))
      runRefresh('api_sendSignOut', 'Making the sign out sheet and emailing it…');
    if (a.dataset.sact === 'closeout') {
      const st = V(), days = st.days || [];
      if (confirm('Close out ' + ((st.event || {}).name || 'this show') + '?\n\nThis hides every sheet in the Shot O\'clock file except the day timesheets (' + days.map(d => d.label).join(', ') + '). Placements, radio and scanner sheets are hidden.'))
        runRefresh('api_closeOut', 'Closing out the show…');
    }
    if (a.dataset.sact === 'schedule') runRefresh('api_refreshSchedule', 'Refreshing partners from the Master Timesheet…');
    if (a.dataset.sact === 'clear' && confirm('Move every team back to Available?')) runRefresh('api_clearPlacements', 'Clearing placements…');
    if (a.dataset.sact === 'radiobase' && confirm('Return all 25 radios to base? Use this at the start or end of the night.')) runRefresh('api_radiosToBase', 'Returning radios…');
    if (a.dataset.sact === 'scannerbase' && confirm('Return all ' + SCANNER_NAMES.length + ' scanners to base? Use this at the start or end of the night.')) runRefresh('api_scannersToBase', 'Returning scanners…');
    return;
  }
  const mb = e.target.closest('[data-mb]');
  if (mb) runRefresh('api_saveSettings', 'Saving…', { maxBreaks: mb.dataset.mb });
  const dy = e.target.closest('[data-day]');
  if (dy) {
    const st = V(), d = (st.days || []).find(x => x.key === dy.dataset.day);
    if (!d || d.key === st.activeDay) return;
    const r = kitList(st, KIT.radio).filter(x => x.person).length, s = kitList(st, KIT.scanner).filter(x => x.person).length;
    if (r || s) {
      const parts = [r ? r + ' radio' + (r > 1 ? 's' : '') : '', s ? s + ' scanner' + (s > 1 ? 's' : '') : ''].filter(Boolean);
      toast(parts.join(' and ') + (r + s > 1 ? ' are' : ' is') + ' still out. Return everything to base before switching days.', true); return;
    }
    if (confirm('Switch to ' + d.label + '?\n\nThe other days\' sheets will be hidden, and ' + d.label + ' gets its own timesheet, placements, radios and scanners.'))
      runRefresh('api_switchDay', 'Switching to ' + d.label + '…', d.key);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'schedSel') runRefresh('api_saveSettings', 'Saving…', { scheduleTab: e.target.value }).then(() => runRefresh('api_refreshSchedule', 'Pulling partner pairs…'));
});
async function runRefresh(fn, text, arg) {
  if (S.pending.length) await flush();
  $('#busyText').textContent = text; $('#busy').classList.remove('hidden');
  try {
    const res = arg === undefined ? await call(fn) : await call(fn, arg);
    S.online = true;
    if (res && res.state) setServer(res.state);
    if (res && res.ok === false) toast(res.msg, true); else if (res && res.msg) toast(res.msg);
  } catch (e) {
    toast('Could not reach Google. Check the connection and try again.', true);
  }
  $('#busy').classList.add('hidden');
  renderAll();
}

/** Shrinks a .fit element only when its longest word does not fit on a line. */
function fitText(root) {
  (root || document).querySelectorAll('.fit').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth <= el.clientWidth + 1) return;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && size > 9) { size -= 0.5; el.style.fontSize = size + 'px'; }
  });
}
let fitT = 0;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => fitText(), 120); });

/* ============ header: title folds away while scrolling Placements ============ */
let compact = false, hdrSettle = 0;
function measureHdr() {
  const h = $('#hdr').offsetHeight, root = document.documentElement.style;
  root.setProperty('--hdr', h + 'px');
  if (!compact && Date.now() > hdrSettle) root.setProperty('--hdrFull', h + 'px');   // page space reserved for the full header
}
function setCompact(on) {
  if (on === compact) return;
  compact = on;
  $('#hdr').classList.toggle('compact', on);
  if (!on) { hdrSettle = Date.now() + 260; setTimeout(measureHdr, 280); }
}
function onScrollHdr() {
  const place = S.view === 'place' && !S.settingsOpen;
  setCompact(place && (compact ? scrollY > 4 : scrollY > 40));
}
addEventListener('scroll', onScrollHdr, { passive: true });
if (window.ResizeObserver) new ResizeObserver(measureHdr).observe($('#hdr'));
setInterval(() => { if (S.settingsOpen) return; if (S.view === 'place') updateRings(); else updatePillRings(); }, 1000);

/* ============ toast, nav, boot ============ */
let toastT = 0;
function toast(msg, red) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (red ? ' red' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 4200);
}
$('#tabTime').innerHTML = I.clock + 'Time Tracking';
$('#tabPlace').innerHTML = I.map + 'Staff Placements';
$('#tabRadio').innerHTML = I.radio + 'Radios';
$('#tabScanner').innerHTML = I.scan + 'Scanners';
$('#tabScanner').onclick = () => { if (S.edit) savePartners(); S.view = 'scanner'; S.settingsOpen = false; LS.set('shotView', 'scanner'); scrollTo(0, 0); renderAll(); };
$('#tabTime').onclick = () => { if (S.edit) savePartners(); S.view = 'time'; S.settingsOpen = false; LS.set('shotView', 'time'); scrollTo(0, 0); renderAll(); };
$('#tabPlace').onclick = () => { if (S.edit) savePartners(); S.view = 'place'; S.settingsOpen = false; LS.set('shotView', 'place'); scrollTo(0, 0); renderAll(); };
$('#tabRadio').onclick = () => { if (S.edit) savePartners(); S.view = 'radio'; S.settingsOpen = false; LS.set('shotView', 'radio'); scrollTo(0, 0); renderAll(); };
$('#gearBtn').onclick = () => { if (S.edit) savePartners(); S.settingsOpen = !S.settingsOpen; scrollTo(0, 0); renderAll(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); poll(); } });
addEventListener('online', () => { S.online = true; flush(); poll(); });
addEventListener('offline', () => { S.online = false; syncDot(); });
if (!HAS_GAS && !IN_ONSITE) $('#demoNote').classList.remove('hidden');

/* ============ inside OnSite: lead code gate, Return to OnSite, updates ============ */
// Opening Shot O'clock needs a device signed in to OnSite with a lead or manager code (ftos.auth, same origin).
// Leaving only happens from Settings > Return to OnSite; reopening the app starts on the OnSite home (start_url).
function onsiteAuth() { try { return JSON.parse(localStorage.getItem('ftos.auth') || 'null'); } catch (e) { return null; } }
function returnToOnsite() { if (S.edit) savePartners(); location.replace('./'); }
if (IN_ONSITE) {
  const a = onsiteAuth();
  if (!a || !a.token) location.replace('./');
  else postJson(ONSITE_API_URL, 'api_info', [a.token]).then(r => {
    if (r && r.auth === false) { try { localStorage.removeItem('ftos.auth'); } catch (e) {} location.replace('./'); }
  }).catch(() => {});
  // A new OnSite build reloads this page when nothing is open (never mid-punch, mid-drag or in Settings).
  setInterval(() => {
    if (document.hidden || S.modal || drag || S.settingsOpen || S.edit) return;
    fetch('version.txt?ts=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
      v = String(v || '').trim();
      if (v && BUILT_VERSION && v !== BUILT_VERSION) location.reload();
    }).catch(() => {});
  }, 60000);
}

renderAll();
flush(); poll();
setInterval(poll, 3000);
setInterval(() => { if (!S.modal && !drag && !S.settingsOpen && S.view === 'time') { renderTime(V()); fitText(); } }, 15000);
</script>
</body>
