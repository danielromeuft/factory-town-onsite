<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Factory Town OnSite</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OnSite">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#ffffff; --soft:#f7f7f9; --line:#e6e6eb; --ink:#111118; --muted:#6b6b76; --brand:#181818;
  --pink:#ec4899; --pink-t:#fdf2f8;
  --blue:#2563eb; --blue-t:#eff6ff;
  --purple:#7c3aed; --purple-t:#f5f3ff;
  --amber:#d97706; --amber-t:#fffbeb;
  --red:#dc2626; --red-t:#fef2f2;
  --green:#16a34a; --green-t:#f0fdf4;
  --r:22px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:calc(86px + var(--safe-t));padding-bottom:calc(20px + var(--safe-b));overscroll-behavior-y:none}
body.hasnav{padding-bottom:calc(84px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* header */
header{position:fixed;left:0;right:0;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:calc(12px + var(--safe-t)) 20px 12px;display:flex;align-items:center;gap:12px}
.hwrap{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:22px;width:auto;display:block;border-radius:3px}
.brand .os{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.sync{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.sync.off{background:var(--red)} .sync.busy{background:#f59e0b}
h1{margin:4px 0 0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{transform:scale(.96)}
body.locked header .iconbtn{display:none}

main{padding:18px 20px 30px;max-width:1100px;margin:0 auto}

/* bottom nav (scan mode) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(4px + var(--safe-b) * .5)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:13px;font-size:12px;font-weight:700;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--blue);background:var(--blue-t)}

/* home */
.home{display:flex;flex-direction:column;gap:18px;max-width:640px;margin:4vh auto 0}
.hero{background:var(--brand);border-radius:28px;padding:28px 26px 24px;color:#fff}
.hero img{width:min(320px,80%);display:block}
.hero .bo{margin-top:14px;font-size:13px;font-weight:800;letter-spacing:.22em;color:#a1a1aa}
.hero .who{margin-top:14px;font-size:16px;color:#d4d4d8;font-weight:600}
.mode{display:flex;align-items:center;gap:20px;width:100%;min-height:150px;border-radius:28px;padding:24px 26px;text-align:left;color:#fff;transition:transform .08s}
.mode:active{transform:scale(.985)}
.mode svg{width:54px;height:54px;flex:none}
.mode b{display:block;font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.mode span{display:block;font-size:17px;font-weight:600;opacity:.85;margin-top:4px}
.mode.shot{background:#7c3aed} .mode.sell{background:var(--pink)} .mode.scan{background:var(--blue)} .mode.flag{background:#b91c1c}

/* shared big buttons */
.big{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:96px;border-radius:26px;font-size:28px;font-weight:800;color:#fff;margin-top:14px;letter-spacing:-.01em}
.big svg{width:32px;height:32px}
.big:active{transform:scale(.985)}
.big:disabled{opacity:.35}
.big.blue{background:var(--blue)} .big.green{background:var(--green)} .big.pink{background:var(--pink)} .big.red{background:var(--red)} .big.dark{background:var(--brand)}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.row2{display:flex;gap:14px}.row2 .big{flex:1}
.linkbtn{display:block;margin:20px auto 0;font-size:17px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:8px}
.step{max-width:640px;margin:0 auto}
.q{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:6px 0 4px}
.qs{font-size:18px;color:var(--muted);margin:0 0 18px;font-weight:500}

/* ticket types */
.types{display:flex;flex-direction:column;gap:14px}
.typebtn{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:112px;border-radius:26px;padding:20px 26px;text-align:left;border:2.5px solid;transition:transform .08s}
.typebtn:active{transform:scale(.985)}
.typebtn b{font-size:38px;font-weight:900;letter-spacing:-.02em}
.typebtn span{display:block;font-size:16px;font-weight:600;margin-top:2px;opacity:.8}
.typebtn svg{width:30px;height:30px;flex:none}
.t-GA{background:var(--blue-t);border-color:#bfdbfe;color:#1d4ed8}
.t-VIP{background:var(--amber-t);border-color:#fde68a;color:#b45309}
.t-UPG{background:var(--purple-t);border-color:#ddd6fe;color:#6d28d9}
.tbadge{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:900;letter-spacing:.02em;border:1.5px solid;white-space:nowrap}

/* keypads */
.digits{display:flex;justify-content:center;gap:12px;margin:8px 0 22px}
.digits i{width:64px;height:78px;border-radius:18px;border:2.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:40px;font-weight:900}
.digits i.on{border-color:var(--ink)}
.cardpre{font-size:40px;font-weight:900;color:var(--muted);align-self:center;letter-spacing:.06em;margin-right:4px}
.dots{display:flex;justify-content:center;gap:18px;margin:6px 0 24px}
.dots i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto}
.pad button{height:80px;border-radius:22px;background:var(--soft);border:1px solid var(--line);font-size:34px;font-weight:800}
.pad button:active{background:var(--line)}
.pad button.blank{visibility:hidden}
.pad svg{width:30px;height:30px}
.perr{min-height:26px;text-align:center;color:var(--red);font-weight:700;font-size:17px;margin-top:14px}

/* confirm */
.summary{border:2px solid var(--line);border-radius:26px;overflow:hidden;margin-top:6px}
.summary .tr{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;font-size:21px;border-top:1px solid var(--line)}
.summary .tr:first-child{border-top:0}
.summary .tr span{color:var(--muted);font-weight:600}
.summary .tr b{font-weight:900}
.summary .tbadge{height:40px;padding:0 18px;font-size:20px}
.handoff{margin-top:18px;border-radius:22px;background:var(--pink-t);border:2px solid #fbcfe8;color:#9d174d;padding:16px 18px;font-size:18px;font-weight:700;text-align:center;line-height:1.35}

/* customer screen */
.cust{max-width:560px;margin:0 auto}
.custhero{background:var(--brand);color:#fff;border-radius:28px;padding:26px 24px}
.custhero img{width:220px;max-width:70%;display:block}
.custhero .bo{margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.22em;color:#a1a1aa}
.custhero h2{margin:16px 0 0;font-size:30px;font-weight:900;letter-spacing:-.02em}
.custhero p{margin:6px 0 0;color:#d4d4d8;font-size:17px;line-height:1.4}
.field{display:block;margin-top:18px}
.field span{display:block;font-size:16px;font-weight:800;color:var(--muted);margin:0 0 8px 4px}
.field input{width:100%;height:68px;border-radius:20px;border:2px solid var(--line);padding:0 20px;font-size:24px;font-weight:600;outline:0;background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--ink)}
.checkmail{font-size:28px;font-weight:900;text-align:center;word-break:break-all;margin:10px 0 4px}

/* done */
.done{text-align:center;padding:10px 0 4px}
.badge{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;color:#fff}
.badge svg{width:62px;height:62px}
.done h2{font-size:36px;margin:0;font-weight:900;letter-spacing:-.02em}
.done .dt{font-size:20px;color:var(--muted);margin-top:8px;font-weight:600;line-height:1.4;word-break:break-word}
.qrbox{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:22px;padding:10px;margin-top:18px}
.qrbox svg{display:block}
.mailfail{margin-top:16px;border-radius:20px;background:var(--red-t);border:2px solid #fecaca;color:var(--red);padding:14px 16px;font-size:18px;font-weight:700;line-height:1.35}
.handback{margin-top:18px;font-size:22px;font-weight:900}

/* scanner */
.cam{position:relative;border-radius:28px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:calc(100vh - 230px);margin:0 auto;width:100%;max-width:640px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18% 14%;border-radius:26px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.9)}
.cam .cstat{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-size:19px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cam.blocked .frame,.cam.blocked .cstat{display:none}
.cam .cmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;color:#fff;font-size:19px;line-height:1.45}
.cam .cmsg b{font-size:24px}
.cam .cmsg button{margin-top:8px;height:56px;padding:0 24px;border-radius:999px;background:#fff;color:#111;font-weight:800;font-size:18px}
.scanfoot{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.scanfoot .stat{font-size:16px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.scanfoot .stat b{color:var(--ink)}

/* scan result: full screen */
.result{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:#fff}
.result.ok{background:var(--green)} .result.bad{background:var(--red)} .result.wait{background:#27272a}
.result .rb{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;animation:pop .25s ease-out}
.result .rb svg{width:110px;height:110px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.result h2{font-size:48px;font-weight:900;letter-spacing:-.02em;margin:24px 0 0;line-height:1.05}
.result .rt{margin-top:14px;display:inline-block;background:#fff;border-radius:999px;padding:8px 22px;font-size:30px;font-weight:900}
.result .rn{font-size:30px;font-weight:800;margin-top:14px}
.result .rm{font-size:24px;font-weight:600;margin-top:12px;line-height:1.35;max-width:620px;opacity:.95}
.result .rtap{position:absolute;bottom:calc(26px + var(--safe-b));font-size:16px;font-weight:700;opacity:.75}

/* tickets sold */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:0 16px;height:56px}
.search svg{width:22px;height:22px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:0;font-size:20px;width:100%;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-size:16px;font-weight:700;color:var(--muted);background:#fff;display:inline-flex;align-items:center;gap:6px}
.fchip b{font-weight:900;color:var(--ink)}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fchip.on{border-color:var(--ink);color:var(--ink)}
.typeline{font-size:15px;color:var(--muted);font-weight:700;margin:-4px 0 14px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tk{position:relative;text-align:left;border-radius:var(--r);border:2px solid var(--line);background:var(--soft);padding:16px 18px 16px 26px;display:flex;flex-direction:column;gap:6px;transition:transform .08s;min-height:120px}
.tk:active{transform:scale(.98)}
.tk::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:6px;border-radius:6px;background:#a1a1aa}
.tk .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk .num{font-size:15px;font-weight:800;color:var(--muted)}
.tk .nm{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15;word-break:break-word}
.tk .st{font-size:15px;font-weight:700;color:var(--muted);line-height:1.35}
.tk.in{background:var(--green-t);border-color:#bbf7d0}.tk.in::before{background:var(--green)}.tk.in .st{color:var(--green)}
.tk.rep{background:var(--red-t);border-color:#fecaca}.tk.rep::before{background:var(--red)}.tk.rep .st{color:var(--red)}
.tk.void{background:#fff;border-style:dashed;opacity:.6}.tk.void .nm{text-decoration:line-through}
.tk.pend{background:#fff;border-style:dashed}
.tk.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{box-shadow:0 0 0 6px rgba(37,99,235,.35)}}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--muted);font-size:19px;line-height:1.5}
.empty b{color:var(--ink)}

/* modal sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(17,17,24,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:#fff;width:100%;max-width:600px;max-height:calc(100vh - 40px);overflow:auto;border-radius:30px;padding:28px 26px 26px;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative}
.close{position:absolute;right:16px;top:16px;width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.close svg{width:24px;height:24px}
.mname{font-size:32px;font-weight:900;letter-spacing:-.02em;margin:4px 56px 4px 0;line-height:1.1;word-break:break-word}
.msub{font-size:17px;color:var(--muted);margin-bottom:18px;font-weight:600}
.kv{border:2px solid var(--line);border-radius:22px;overflow:hidden}
.kv .tr{display:flex;justify-content:space-between;gap:14px;padding:13px 18px;font-size:17px;border-top:1px solid var(--line)}
.kv .tr:first-child{border-top:0}
.kv .tr span{color:var(--muted);font-weight:600;flex:none}
.kv .tr b{font-weight:800;text-align:right;word-break:break-word}
.hist{margin-top:16px}
.hist .h{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);font-size:17px}
.hist .h:first-child{border-top:0}
.hist .h i{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:#a1a1aa}
.hist .h i.g{background:var(--green)} .hist .h i.r{background:var(--red)}
.hist .h small{display:block;color:var(--muted);font-weight:600;font-size:15px}
.notes{white-space:pre-wrap;font-size:15px;color:var(--muted);background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:14px;line-height:1.45}
.bigset{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:20px;font-size:20px;font-weight:800;margin-top:12px;background:var(--soft);border:2px solid var(--line)}
.bigset svg{width:24px;height:24px;flex:none}
.bigset.red{background:var(--red);color:#fff;border-color:var(--red)}
.bigset.green{background:var(--green);color:#fff;border-color:var(--green)}
.bigset.dark{background:var(--brand);color:#fff;border-color:var(--brand)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-top:1px solid var(--line);font-size:18px}
.setrow:first-of-type{border-top:0}
.setrow span{color:var(--muted);font-weight:600}
.setrow b{font-weight:800}

/* flag */
.fl-alt{height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:800}
/* Flag start: three big choices */
.fl-pick{display:flex;flex-direction:column;gap:16px;max-width:640px;margin:2vh auto 0}
.fl-pick .mode{min-height:132px}
.mode.fticket{background:var(--blue)} .mode.fid{background:#b91c1c} .mode.fname{background:#27272a}
/* ID camera: wider view, card-shaped frame, live guidance */
.cam.idcam{aspect-ratio:4/3}
.cam .frame.idframe{inset:auto;left:7%;right:7%;top:50%;aspect-ratio:1.586;transform:translateY(-50%);transition:border-color .25s,box-shadow .25s}
.cam .frame.idframe.warn{border-color:#facc15}
.cam .frame.idframe.good{border-color:#22c55e;animation:idpulse 1s ease-in-out infinite}
.cam .frame.idframe.got{border-color:#22c55e;border-width:8px}
@keyframes idpulse{50%{box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 0 8px rgba(34,197,94,.45)}}
.cam .frame .bz{position:absolute;left:6%;right:6%;bottom:12%;height:30%;border:2px dashed rgba(255,255,255,.55);border-radius:10px}
.cam .frame.good .bz,.cam .frame.got .bz{border-color:rgba(34,197,94,.8)}
.guide{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:92%;padding:12px 20px 12px 14px;border-radius:999px;background:rgba(17,17,24,.82);color:#fff;font-size:21px;font-weight:900;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.guide svg{width:28px;height:28px;flex:none}
.guide.warn{background:rgba(161,98,7,.92)} .guide.good{background:rgba(21,128,61,.92)}
.guide.pop{animation:gpop .35s ease-out}
@keyframes gpop{0%{transform:translateX(-50%) scale(.85);opacity:.4}100%{transform:translateX(-50%) scale(1);opacity:1}}
.guide .spin,.loadspin{width:24px;height:24px;border-radius:50%;border:3.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cam .gotit{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(21,128,61,.55);color:#fff;font-size:30px;font-weight:900;animation:gpop .3s ease-out}
.cam .gotit svg{width:84px;height:84px}
.cam .shot{position:absolute;inset:0;background:#fff;animation:flash .35s ease-out forwards}
@keyframes flash{to{opacity:0}}
.fl-alt.hl{border-color:var(--red);color:var(--red);animation:hl 1.2s ease-in-out infinite}
@keyframes hl{50%{transform:scale(1.04)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:14vh;text-align:center}
.loading .loadspin{width:64px;height:64px;border-width:7px;border-color:var(--line);border-top-color:var(--ink)}
.loading .q{margin:0}
.shutter{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:640px;margin:14px auto 0;height:78px;border-radius:999px;background:var(--ink);color:#fff;font-size:24px;font-weight:900}
.shutter svg{width:32px;height:32px}
.idphoto{display:block;width:100%;max-width:640px;margin:0 auto;border-radius:24px;border:2px solid var(--line)}
.idthumb{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:10px;border-radius:18px;background:var(--soft);border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--muted)}
.idthumb img{width:96px;height:60px;object-fit:cover;border-radius:10px;flex:none}
.digits.dob{align-items:center}
.digits.dob i{width:48px;height:64px;font-size:32px}

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ============ boot values from the server ============ */
// The same file runs two ways: Apps Script fills in its template tags below; build.js swaps these lines for the GitHub copy.
const HOSTED = true;
const TICKET_PARAM = (new URLSearchParams(location.search).get('t') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
const LOGO = 'logo.png';
const APP_URL = '';
const API_URL = 'https://script.google.com/macros/s/AKfycbyTyzc2jY-XwgvSQmlDlJhXqWg4mQsF7yR3dqCs23wvfTx1sCPBaMHWBQc2IM9-vlETWg/exec';
const APP_VERSION = '12';

/* ============ icons ============ */
const I = {
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>',
  sell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z"/><path d="M12 9v6M9 12h6"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9.5"/></svg>',
  idcard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5.5 16c.6-1.5 1.7-2.2 3-2.2s2.4.7 3 2.2M14 10h4.5M14 13.5h3"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  closer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5M9 9l-4-4M15 9l4-4M9 15l-4 4M15 15l4 4"/></svg>',
  further: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5M4 4l5 5M20 4l-5 5M4 20l5-5M20 20l-5-5"/></svg>',
  still: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-6a1.5 1.5 0 0 1 3 0V12M14 11.5V7a1.5 1.5 0 0 1 3 0v7c0 3.9-2.6 7-6.5 7-2.5 0-4.2-1.4-5.4-3.5L3.6 15c-.7-1.2.9-2.4 1.9-1.4L8 16"/></svg>',
};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TYPE_CLASS = { 'GA': 'GA', 'VIP': 'VIP', 'VIP Upgrade': 'UPG' };
const TYPE_COLOR = { 'GA': ['#1d4ed8', '#eff6ff', '#bfdbfe'], 'VIP': ['#b45309', '#fffbeb', '#fde68a'], 'VIP Upgrade': ['#6d28d9', '#f5f3ff', '#ddd6fe'] };
function tbadge(type) {
  const c = TYPE_COLOR[type] || ['#111', '#fff', '#ddd'];
  return '<span class="tbadge" style="color:' + c[0] + ';background:' + c[1] + ';border-color:' + c[2] + '">' + esc(type) + '</span>';
}
const fmtT = ms => ms ? new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';
const fmtTs = ms => ms ? new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '';
function titleCase(s) { return String(s || '').toLowerCase().replace(/(^|[\s'-])\S/g, m => m.toUpperCase()); }

function toast(msg, ms) {
  const el = $('#toast');
  el.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.innerHTML = ''; }, ms || 3200);
}

/** QR as crisp SVG from the server's "0101/1100/..." rows. */
function qrSvg(str, px) {
  const rows = String(str || '').split('/'), n = rows.length, b = 3, N = n + 2 * b;
  let d = '';
  rows.forEach((r, y) => { for (let x = 0; x < n; x++) if (r[x] === '1') d += 'M' + (x + b) + ' ' + (y + b) + 'h1v1h-1z'; });
  return '<svg viewBox="0 0 ' + N + ' ' + N + '" width="' + px + '" height="' + px + '" shape-rendering="crispEdges"><rect width="' + N + '" height="' + N + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

/* ============ server calls ============ */
const HAS_GAS = !!(window.google && google.script && google.script.run);
function call(fn, ...args) {
  setSync('busy');
  // GitHub copy: plain-text POST to the Apps Script web app (a "simple" request, so no CORS preflight)
  const p = HAS_GAS
    ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))
    : fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(r => { if (r && r.error) throw new Error(r.error); return r; });
  return p.then(r => {
    setSync('ok');
    if (r && r.auth === false) { signedOut(); throw new Error(r.msg || 'Signed out'); }
    return r;
  }, err => { setSync('off'); throw err; });
}
function setSync(s) { const el = $('#sync'); el.className = 'sync' + (s === 'busy' ? ' busy' : s === 'off' ? ' off' : ''); }

/* ============ login that sticks until Sign Out ============ */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('ftos.' + k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('ftos.' + k) : localStorage.setItem('ftos.' + k, JSON.stringify(v)); } catch (e) {} },
};
let AUTH = store.get('auth');   // { token, name, dev }
/** Sell and Scan are hidden (10/8). A developer code can turn them back on for this device in Settings > Developer. */
const sellScanOn = () => !!(AUTH && AUTH.dev && store.get('devSellScan'));

function signedOut() {
  AUTH = null; store.set('auth', null);
  stopCamera();
  mode = 'home'; render();
  toast('You were signed out. Enter your code again.');
}

/** Opens the 6-digit keypad; resolves once the device is signed in. */
function requireLogin(then) {
  if (AUTH && AUTH.token) return then();
  let code = '';
  const draw = (err, shake) => {
    $('#modal').innerHTML = '<div class="overlay"><div class="sheet">' +
      '<button class="close" id="kx">' + I.x + '</button>' +
      '<div class="mname">Enter your code</div><div class="msub">Last 6 of your SSN. This device stays signed in until you tap Sign Out in Settings.</div>' +
      '<div class="dots' + (shake ? ' shake' : '') + '">' + [0, 1, 2, 3, 4, 5].map(i => '<i class="' + (i < code.length ? 'on' : '') + '"></i>').join('') + '</div>' +
      padHtml() + '<div class="perr">' + esc(err || '') + '</div></div></div>';
    $('#kx').onclick = () => { $('#modal').innerHTML = ''; };
    bindPad(d => {
      if (d === 'del') code = code.slice(0, -1);
      else if (code.length < 6) code += d;
      draw();
      if (code.length === 6) {
        const tried = code; code = '';
        call('api_login', tried).then(r => {
          if (!r.ok) return draw(r.msg, true);
          AUTH = { token: r.token, name: r.name, dev: !!r.dev }; store.set('auth', AUTH);
          $('#modal').innerHTML = '';
          toast('Signed in as ' + r.name);
          then();
        }).catch(() => draw('No connection. Try again.', true));
      }
    });
  };
  draw();
}

function padHtml() {
  return '<div class="pad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del']
    .map(k => k === '' ? '<button class="blank"></button>' : '<button data-k="' + k + '">' + (k === 'del' ? I.del : k) + '</button>').join('') + '</div>';
}
function bindPad(fn) {
  document.querySelectorAll('.pad button[data-k]').forEach(b => { b.onclick = () => fn(b.dataset.k); });
}

/* ============ app state ============ */
let mode = 'home';      // home | sell | scan | flag
let tab = 'scan';       // scan | list  (inside scan mode)
let S = null;           // tonight's state from the server
let sale = null;        // the sale in progress
let filter = 'all', query = '';
let seenLast = {};      // ticket id -> last activity, to flash changed cards

function setTitle(t) { $('#title').textContent = t; }

function render() {
  document.body.classList.toggle('hasnav', mode === 'scan');
  $('#nav').classList.toggle('hidden', mode !== 'scan');
  $('#homeBtn').classList.toggle('hidden', mode === 'home');
  document.body.classList.toggle('locked', mode === 'sell' && sale && (sale.step === 'customer' || sale.step === 'checkmail'));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (mode === 'home') { stopCamera(); (HAS_GAS && APP_URL) ? renderMoved() : renderHome(); }
  else if (mode === 'sell') { stopCamera(); renderSell(); }
  else if (mode === 'scan') { tab === 'scan' ? renderScan() : (stopCamera(), renderList()); }
  else if (mode === 'flag') renderFlag();
}

/* ============ home ============ */
/** The old Apps Script link: the camera can't work there, so send staff to the GitHub app. */
function renderMoved() {
  setTitle('New link');
  $('#main').innerHTML = '<div class="home"><div class="hero"><img src="' + LOGO + '" alt="Factory Town"><div class="bo">BOX OFFICE &middot; ONSITE</div>' +
    '<div class="who">This app has a new home so the camera works on iPads.</div></div>' +
    '<a class="mode scan" style="text-decoration:none" href="' + esc(APP_URL) + '" target="_blank" rel="noopener">' + I.scan + '<div><b>Open the app</b><span>Then Share &gt; Add to Home Screen, and delete the old icon</span></div></a>' +
    '<div class="qs" style="text-align:center;word-break:break-all">' + esc(APP_URL) + '</div></div>';
}
function renderHome() {
  setTitle('Box Office');
  $('#main').innerHTML = '<div class="home">' +
    '<div class="hero"><img src="' + LOGO + '" alt="Factory Town"><div class="bo">BOX OFFICE &middot; ONSITE</div>' +
    '<div class="who">' + (AUTH ? 'Signed in as <b style="color:#fff">' + esc(AUTH.name) + '</b>' : 'Tap any button and enter your code') + '</div></div>' +
    '<button class="mode shot" id="goShot">' + I.clock + '<div><b>Shot O\'clock</b><span>Time tracking, placements, radios and scanners</span></div></button>' +
    (sellScanOn() ? '<button class="mode sell" id="goSell">' + I.sell + '<div><b>Sell</b><span>Log a sale and send the customer their QR</span></div></button>' +
      '<button class="mode scan" id="goScan">' + I.scan + '<div><b>Scan</b><span>Check tickets at the gate</span></div></button>' : '') +

let stream = null, video = null, canvas = null, scanTimer = null, busy = false;
let lastCode = '', lastCodeAt = 0;
const detector = ('BarcodeDetector' in window) ? (() => { try { return new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { return null; } })() : null;

function camMsg(html) {

/**
 * The ID steps want the sharpest picture the camera has: 4K and some optical zoom. On 10/8 an iPhone gave 1080 wide
 * at 1080p, which left under 2 pixels per bar on a Florida license barcode (the reader needs about 3).
 * Tickets keep 1080p (QR codes are big and 4K is slower), so the camera restarts when switching between them.
 */
let streamHi = false, camZoom = 0;
const ID_ZOOM = 1.8;
function startCamera() {
  video = $('#vid');
  if (!video) return;
  const hi = mode === 'flag' && !!fl && (fl.step === 'id' || fl.step === 'photo');
  if (stream && streamHi !== hi) stopCamera();
  if (stream) { video.srcObject = stream; video.play().catch(() => {}); const cs = $('#cstat'); if (cs) cs.textContent = camHint(); loopScan(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return camMsg('<b>No camera access here</b>Open this app in Safari or Chrome, or check in by hand from Tickets Sold.');
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: hi ? 3840 : 1920 }, height: { ideal: hi ? 2160 : 1080 } }, audio: false })
    .then(s => {
      stream = s; streamHi = hi; camZoom = 0;
      if (!video || !document.body.contains(video)) { stopCamera(); return; }
      video.srcObject = s; video.play().catch(() => {});
      $('#cstat').textContent = camHint();
      // Keep refocusing as an ID moves closer, and on the ID steps zoom in a little so the card can stay at a
      // distance the camera can focus at (both ignored where the camera does not support them).
      try {
        const tr = s.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
        if ((cap.focusMode || []).indexOf('continuous') >= 0) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        if (hi && cap.zoom && cap.zoom.max > 1) {
          const z = Math.max(cap.zoom.min || 1, Math.min(cap.zoom.max, ID_ZOOM));
          tr.applyConstraints({ advanced: [{ zoom: z }] }).then(() => { camZoom = z; }).catch(() => {});
        }
      } catch (e) {}
      loopScan();
    })
    .catch(err => {
      camMsg('<b>Camera blocked</b>Allow camera access for this app, then try again. You can still check people in by hand from Tickets Sold.' +
        '<button id="camRetry">Try again</button>');
      const b = $('#camRetry'); if (b) b.onclick = () => { camMsg(''); startCamera(); };
      console.warn(err);
    });
}

/** The camera runs on the Scan tab and on the Flag ticket, ID and ID photo steps. */
const camActive = () => (mode === 'scan' && tab === 'scan') || (mode === 'flag' && fl && (fl.step === 'ticket' || fl.step === 'id' || fl.step === 'photo'));
const camHint = () => mode === 'flag' && fl && fl.step === 'id' ? '' : mode === 'flag' && fl && fl.step === 'photo' ? 'Front of the ID inside the frame' : 'Point at a ticket QR';

function stopCamera() {
  clearTimeout(scanTimer); scanTimer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function loopScan() {
  clearTimeout(scanTimer);
  const tick = async () => {
    if (!stream || !camActive()) return;
    const step = mode === 'flag' && fl ? fl.step : '';
    if (!busy && video && video.readyState >= 2 && step !== 'photo') {
      const code = await (step === 'id' ? readId() : readFrame());
      if (code && camActive()) mode === 'flag' ? onFlagCode(code) : onCode(code);
    }
    scanTimer = setTimeout(tick, 120);
  };
  tick();
}

async function readFrame() {
  try {
    if (detector) {
      const found = await detector.detect(video);
      return found && found[0] ? found[0].rawValue : '';
    }
    if (!window.jsQR) return '';
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return '';
    const scale = Math.min(1, 720 / Math.max(vw, vh));
    const w = Math.round(vw * scale), h = Math.round(vh * scale);
    canvas = canvas || document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const g = canvas.getContext('2d', { willReadFrequently: true });
    g.drawImage(video, 0, 0, w, h);
    const r = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    return r ? r.data : '';
  } catch (e) { return ''; }
}

function onCode(code) {
  const now = Date.now();
  // the camera keeps seeing the same QR: ignore it for a few seconds after its result closes
  if (code === lastCode && now - lastCodeAt < 6000) return;
  busy = true; lastCode = code; lastCodeAt = now;
  showResult({ wait: true });
  call('api_scan', AUTH.token, code, false).then(r => {
    showResult(r);
    if (r.ticket) mergeTicket(r.ticket);
  }).catch(err => {
    if (!AUTH) return;
    lastCode = '';
    showResult({ result: 'offline', msg: 'No connection. Scan again.' });
  });
}

/* sounds: Web Audio, unlocked by the first tap on Sell or Scan (iOS needs a tap first) */
let AC = null;
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(); g.gain.value = 0; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + .01);
  } catch (e) {}
}
function tone(freq, start, dur, type, vol) {
  if (!AC) return;
  const t0 = AC.currentTime + start, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .3, t0 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function beepOk() { tone(1318, 0, .11, 'sine', .35); tone(1760, .12, .2, 'sine', .35); }
function beepBad() { tone(196, 0, .28, 'square', .2); tone(147, .32, .4, 'square', .2); }

/* ============ flag ============
 * Flag a guest so another gate or Guest Services sees it later (e.g. a VIP ticket holder under 21 let in as GA).
 * Opens on three choices (10/8): Ticket, ID, Name.
 * 1. Ticket: scan any QR (DICE or ours). Already flagged: the flag shows in red, with Edit and Remove.
 * 2. ID: scan the barcode on the back (live advice on the camera). Only the name and date of birth leave the
 *    device; the rest of the ID barcode is thrown away right here. If it will not read: take a photo of the
 *    front instead (saved with the flag), then type the name and date of birth.
 * 3. Name: search by part of a name and/or a date of birth.
 * Same name + DOB already flagged (they switched tickets): the flag shows, and this ticket can be added to it.
 * Otherwise pick the flag type and save.
 */
const FLAG_TYPES = ['Under 21 VIP', 'Third Party Ticket', 'No re-entry', 'Ejected / banned', 'Other'];
const FLAG_STYLE = { 'Under 21 VIP': ['#dc2626', 'U21'], 'Third Party Ticket': ['#2563eb', '3P'], 'No re-entry': ['#d97706', 'NR'], 'Ejected / banned': ['#18181b', 'BAN'], 'Other': ['#7c3aed', '!'] };
// Saved on the sheet as Admitted / Denied; the buttons say Admit Entry / Deny Entry.
const ENTRY_TEXT = { Admitted: 'Admit Entry', Denied: 'Deny Entry' };
const ENTRY_DONE = { Admitted: 'Entry admitted', Denied: 'Entry denied' };
let fl = null;   // the flag flow in progress

/**
 * ID barcode reader: zxing-cpp built for the browser (zxing-wasm), loaded the first time Flag opens the ID step.
 * Only the picture inside the card frame is read, at the camera's full resolution. Before 10/8 the whole picture
 * was shrunk first, and the thin bars of a license barcode blurred together, so real IDs never read.
 * Each frame also gets a quick look (light, glare, how big the barcode is) to tell the person what to change.
 */
const ZX_BASE = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/';
let zxLoading = null, zxReady = false;
function loadZX() {
  if (zxReady) return Promise.resolve();
  return zxLoading || (zxLoading = new Promise((res, rej) => {
    const fail = e => { zxLoading = null; rej(e); };
    const s = document.createElement('script');
    s.src = ZX_BASE + 'iife/reader/index.js';
    s.onload = () => {
      try {
        ZXingWASM.prepareZXingModule({ overrides: { locateFile: (p, pre) => p.endsWith('.wasm') ? ZX_BASE + 'reader/' + p : pre + p }, fireImmediately: true })
          .then(() => { zxReady = true; res(); }, fail);
      } catch (e) { fail(e); }
    };
    s.onerror = () => fail(new Error('load'));
    document.head.appendChild(s);
  }));
}

/** Where an on-screen element sits in the camera's own pixels (the video is shown with object-fit: cover). pad grows it. */
function videoBox(el, pad) {
  const vr = video.getBoundingClientRect(), r = el.getBoundingClientRect(), vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(vr.width / vw, vr.height / vh), ox = (vw * s - vr.width) / 2, oy = (vh * s - vr.height) / 2;
  let w = r.width / s, h = r.height / s, x = (r.left - vr.left + ox) / s - w * pad, y = (r.top - vr.top + oy) / s - h * pad;
  w *= 1 + 2 * pad; h *= 1 + 2 * pad;
  x = Math.max(0, x); y = Math.max(0, y);
  return { x: Math.round(x), y: Math.round(y), w: Math.round(Math.min(vw - x, w)), h: Math.round(Math.min(vh - y, h)) };
}

/**
 * Quick look at the card frame: brightness, glare, and where the barcode texture is. A PDF417 is the busiest
 * left-to-right pattern on the card, so cells with strong left-right changes mark it; rows with several busy cells
 * give its width. Too narrow = too far away. Touching both sides = too close.
 */
let lookCv = null;
function idLook(b) {
  const W = 320, H = Math.max(60, Math.round(W * b.h / b.w));
  lookCv = lookCv || document.createElement('canvas'); lookCv.width = W; lookCv.height = H;
  const g = lookCv.getContext('2d', { willReadFrequently: true });
  g.drawImage(video, b.x, b.y, b.w, b.h, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data, L = new Float32Array(W * H);
  let sum = 0, hot = 0;
  for (let i = 0; i < W * H; i++) { const v = (d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000; L[i] = v; sum += v; if (v > 248) hot++; }
  const CX = 20, CY = 12, cell = new Float32Array(CX * CY), cw = W / CX, ch = H / CY;
  for (let y = 0; y < H; y++) for (let x = 0; x < W - 1; x++) cell[((y / ch) | 0) * CX + ((x / cw) | 0)] += Math.abs(L[y * W + x + 1] - L[y * W + x]);
  const area = cw * ch;
  let minX = CX, maxX = -1, rows = 0, peak = 0;
  for (let r = 0; r < CY; r++) {
    let n = 0, lo = CX, hi = -1;
    for (let c = 0; c < CX; c++) { const e = cell[r * CX + c] / area; peak = Math.max(peak, e); if (e > ID_BUSY) { n++; lo = Math.min(lo, c); hi = Math.max(hi, c); } }
    if (n >= 5) { rows++; minX = Math.min(minX, lo); maxX = Math.max(maxX, hi); }
  }
  // Tilt: the bars are the strongest edges, so the most common edge direction (within 25 degrees of upright) is their angle.
  const hist = new Float32Array(51);

    m.innerHTML = '<div class="step"><div class="fl-head">' + I.alert + (fl.flags.length > 1 ? fl.flags.length + ' flags' : 'Flagged') +
      '<span>' + (fl.via === 'id' ? 'Matched by name + date of birth' : 'This ticket was flagged') + '</span></div>' +
      fl.flags.map((f, i) => flagCard(f, i, {})).join('') +
      (link ? '<button class="big dark" id="link">Add ' + what + ' to the flag</button>' : '') +
      (fl.via === 'id' && fl.person ? '<button class="bigset" id="newOne">Different person: flag them separately</button>' : '') +
      '<button class="big ghost" id="next">' + nextLabel() + '</button></div>';
    bindCards(m);
    if ($('#link')) $('#link').onclick = e => saveFlag(Object.assign({}, fl.flags[0], { code: fl.code, photo: fl.photo || '' }), e.target, 'Added ' + what + ' to the flag.');
    if ($('#newOne')) $('#newOne').onclick = () => { fl.edit = null; fl.type = ''; fl.note = ''; fl.platform = ''; fl.entry = ''; fl.step = 'form'; render(); };
    $('#next').onclick = flagNext;
  } else if (fl.step === 'form') {
    const p = fl.person, age = ageOf(p.dob), under = age < 21;
    if (!fl.type && !fl.edit) fl.type = under ? 'Under 21 VIP' : '';
    const third = fl.type === 'Third Party Ticket';
    setTitle(fl.edit ? 'Edit flag #' + fl.edit.n : 'Flag · New');
    m.innerHTML = '<div class="step"><div class="q">' + (fl.edit ? 'Edit flag' : 'Flag this person') + '</div>' +
      '<div class="summary"><div class="tr"><span>Name</span><b>' + esc(p.name) + '</b></div>' +
      '<div class="tr"><span>Date of birth</span><b>' + esc(fmtDob(p.dob)) + '</b></div>' +
      '<div class="tr"><span>Age</span><b style="color:' + (under ? 'var(--red)' : 'var(--ink)') + '">' + age + (under ? ' &middot; UNDER 21' : '') + '</b></div>' +
      (fl.code && !fl.edit ? '<div class="tr"><span>Ticket</span><b>Scanned</b></div>' : '') + '</div>' +
      (fl.photo && !fl.edit ? '<div style="margin-top:12px">' + idThumb() + '</div>' : '') +
      '<button class="linkbtn" id="fix" style="margin-top:8px">Fix name or date of birth</button>' +
      '<div class="field"><span>Flag type</span></div><div class="fl-types">' +
      FLAG_TYPES.map(t => {
        const off = t === 'Under 21 VIP' && !under;
        return '<button class="fl-t' + (fl.type === t ? ' on' : '') + '" data-t="' + esc(t) + '" style="--fc:' + FLAG_STYLE[t][0] + '"' + (off ? ' disabled' : '') + '>' + esc(t) + (off ? '<small>They are 21+</small>' : '') + '</button>';
      }).join('') + '</div>' +
      (third ? '<label class="field"><span>Platform (required)</span><input id="fplat" autocomplete="off" autocapitalize="words" maxlength="60" placeholder="CrowdVolt, Ticketmaster, StubHub…" value="' + esc(fl.platform || '') + '"></label>' : '') +
      '<label class="field"><span>Note' + (fl.type === 'Other' ? ' (required)' : ' (optional)') + '</span><input id="fnote" autocomplete="off" maxlength="300" value="' + esc(fl.note || '') + '"></label>' +
      '<div class="field"><span>Entry</span></div><div class="fl-entry">' +
      ['Admitted', 'Denied'].map(v => '<button class="fl-e ' + (v === 'Admitted' ? 'yes' : 'no') + (fl.entry === v ? ' on' : '') + '" data-e="' + v + '">' + (v === 'Admitted' ? I.check : I.x) + ENTRY_TEXT[v] + '</button>').join('') + '</div>' +
      '<button class="big red" id="save"' + (fl.type && fl.entry ? '' : ' disabled') + '>' + I.check + (fl.edit ? 'Save changes' : 'Save flag') + '</button>' +
      '<button class="linkbtn" id="cx">Cancel</button></div>';
    const note = $('#fnote'), plat = $('#fplat');
    const keep = () => { fl.note = note.value; if (plat) fl.platform = plat.value; };
    note.oninput = keep;
    if (plat) plat.oninput = keep;
    m.querySelectorAll('.fl-t').forEach(b => { b.onclick = () => { keep(); fl.type = b.dataset.t; render(); if (fl.type === 'Third Party Ticket' && !fl.platform) $('#fplat').focus(); }; });
    m.querySelectorAll('.fl-e').forEach(b => { b.onclick = () => { keep(); fl.entry = b.dataset.e; render(); }; });
    $('#fix').onclick = () => { keep(); const [y, mo, d] = p.dob.split('-'); fl.man = { name: p.name, dob: mo + d + y }; fl.manMode = 'flag'; fl.back = ''; fl.fixing = true; fl.step = 'manual'; render(); };
    $('#cx').onclick = flagStart;
    $('#save').onclick = e => {
      keep();
      fl.note = fl.note.trim();
      fl.platform = third ? String(fl.platform || '').trim() : '';
      if (third && !fl.platform) return toast('Type the ticket platform.');
      if (fl.type === 'Other' && !fl.note) return toast('Add a note for "Other".');
      if (!fl.entry) return toast('Pick Admit Entry or Deny Entry.');
      saveFlag({ n: fl.edit ? fl.edit.n : 0, type: fl.type, name: p.name, dob: p.dob, note: fl.note, platform: fl.platform, entry: fl.entry, code: fl.edit ? '' : (fl.code || ''), photo: fl.edit ? '' : (fl.photo || '') }, e.target);
    };
  } else if (fl.step === 'saved') {
    const f = fl.saved, c = (FLAG_STYLE[f.type] || FLAG_STYLE.Other)[0];
    setTitle('Flag saved');
    m.innerHTML = '<div class="step"><div class="fl-card" style="--fc:' + c + '"><div class="fl-type">' + esc(f.type) + '</div>' +
      '<div class="fl-name">' + esc(titleCase(f.name)) + '</div><div class="fl-dob">DOB ' + esc(fmtDob(f.dob)) + ' &middot; ' + f.age + '</div>' +
      flagExtras(f) +
      '<div class="fl-by">' + esc(fl.savedMsg || 'Flag saved. Any gate or Guest Services scanning this ticket or ID will see it.') + '</div></div>' +
      '<button class="big dark" id="next">' + nextLabel() + '</button></div>';
    $('#next').onclick = flagNext;
    clearTimeout(renderFlag.t);
    renderFlag.t = setTimeout(() => { if (mode === 'flag' && fl && fl.step === 'saved') flagNext(); }, 5000);
  }
}

/** One flag as a colored card. opts.match: show how a search matched; opts.link: offer to add the scanned ticket. */
const MATCH_TEXT = { both: 'Name + DOB match', name: 'Name match', dob: 'DOB match' };
function flagCard(f, i, opts) {
  const c = (FLAG_STYLE[f.type] || FLAG_STYLE.Other)[0];
  return '<div class="fl-card" style="--fc:' + c + '">' +
    (opts.match && f.match ? '<div class="fl-match">' + esc(MATCH_TEXT[f.match] || '') + '</div>' : '') +
    '<div class="fl-type">' + esc(f.type) + '</div>' +
    '<div class="fl-name">' + esc(titleCase(f.name)) + '</div>' +
    '<div class="fl-dob">DOB ' + esc(fmtDob(f.dob)) + (f.age != null ? ' &middot; <b>' + f.age + ' now</b>' : '') + '</div>' +
    flagExtras(f) +
    (f.note ? '<div class="fl-note">' + esc(f.note) + '</div>' : '') +
    '<div class="fl-by">Flagged by ' + esc(f.by) + ' &middot; ' + esc(fmtWhenMs(f.at)) + (f.event ? ' &middot; ' + esc(f.event) : '') + '</div>' +
    (f.photo ? '<button class="bigset" data-photo="' + i + '">' + I.camera + 'View ID photo</button>' : '') +
    (opts.link ? '<button class="bigset" data-link="' + i + '">Add the scanned ticket to this flag</button>' : '') +
    '<div class="row2"><button class="bigset" data-edit="' + i + '">Edit</button><button class="bigset red" data-rm="' + i + '">Remove</button></div></div>';
}
/** The ID photo waiting to be saved with a flag, as a small preview. */
const idThumb = () => '<div class="idthumb"><img src="' + fl.photo + '" alt="">ID photo will be saved with the flag</div>';
/** Flag card > View ID photo: fetched from Drive through the server (sign-in needed), shown full width. */
function showIdPhoto(f) {
  $('#modal').innerHTML = '<div class="overlay" id="ov"><div class="sheet"><button class="close" id="mx">' + I.x + '</button>' +
    '<div class="mname">' + esc(titleCase(f.name)) + '</div><div class="msub">ID photo · flag #' + f.n + '</div><div id="phbox">' + loadingHtml('Loading photo…') + '</div></div></div>';
  const close = () => { $('#modal').innerHTML = ''; };
  $('#mx').onclick = close; $('#ov').onclick = e => { if (e.target.id === 'ov') close(); };
  call('api_flagPhoto', AUTH.token, f.n).then(r => {
    const box = $('#phbox'); if (!box) return;
    box.innerHTML = r.ok ? '<img class="idphoto" src="' + r.photo + '" alt="ID photo">' : '<p class="qs">' + esc(r.msg || 'Could not load the photo.') + '</p>';
  }).catch(() => { const box = $('#phbox'); if (box) box.innerHTML = '<p class="qs">No connection. Try again.</p>'; });
}

/** Platform (third party tickets) and whether they were let in, shown under the DOB on a flag card. */
function flagExtras(f) {
  return (f.platform ? '<div class="fl-plat">Platform: <b>' + esc(f.platform) + '</b></div>' : '') +
    (ENTRY_DONE[f.entry] ? '<div class="fl-ent ' + (f.entry === 'Admitted' ? 'yes' : 'no') + '">' + (f.entry === 'Admitted' ? I.check : I.x) + ENTRY_DONE[f.entry] + '</div>' : '');
}
function bindCards(m) {
  m.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => { const f = fl.flags[+b.dataset.edit]; fl.edit = f; fl.person = { name: f.name, dob: f.dob }; fl.type = f.type; fl.note = f.note; fl.platform = f.platform || ''; fl.entry = f.entry || ''; fl.step = 'form'; render(); }; });
  m.querySelectorAll('[data-rm]').forEach(b => { b.onclick = () => removeFlag(fl.flags[+b.dataset.rm]); });
  m.querySelectorAll('[data-photo]').forEach(b => { b.onclick = () => showIdPhoto(fl.flags[+b.dataset.photo]); });
  m.querySelectorAll('[data-link]').forEach(b => { b.onclick = e => saveFlag(Object.assign({}, fl.flags[+b.dataset.link], { code: fl.code }), e.target, 'Ticket added to the flag.'); });
}

/** Search > part of a name and/or a DOB. */
function searchFlags(name, dob) {
  const code = fl.code || '', fromClear = !!code;
  busy = true;
  fl = Object.assign(fl, { step: 'checking' }); render();
  call('api_flagSearch', AUTH.token, { name: name, dob: dob }).then(r => {
    busy = false;
    if (!r.ok) { toast(r.msg || 'Could not search.'); fl.step = 'manual'; render(); return; }
    // Came here to flag a scanned ticket, typed the full name + DOB, and nothing matched: go straight to the form.
    if (!r.flags.length && fromClear && dob && name.split(' ').filter(Boolean).length >= 2) {
      fl = { step: 'form', code: code, person: { name: titleCase(name), dob: dob }, type: '', note: '' }; render(); return;
    }
    fl = { step: 'results', code: code, flags: r.flags, query: { name: name, dob: dob } };
    if (r.flags.length) { beepBad(); if (navigator.vibrate) navigator.vibrate([120, 80, 120]); }
    render();
  }).catch(() => { busy = false; toast('No connection. Try again.'); fl.step = 'manual'; render(); });
}

/** A ticket or an ID was read by the camera. */
function onFlagCode(code) {
  const now = Date.now();
  if (code === lastCode && now - lastCodeAt < 6000) return;
  lastCode = code; lastCodeAt = now;
  if (fl.step === 'ticket') {
    busy = true;
    fl = { step: 'checking', code: code, via: 'ticket' }; render();
    call('api_flagCheck', AUTH.token, { code: code }).then(r => {
      busy = false;
      if (!r.ok) { toast(r.msg || 'Could not check.'); flagNext(); return; }
      if (r.flags.length) { fl = { step: 'found', code: code, via: 'ticket', flags: r.flags }; beepBad(); if (navigator.vibrate) navigator.vibrate([120, 80, 120]); }
      else { fl = { step: 'clear', code: code, via: 'ticket' }; beepOk(); }
      render();
    }).catch(() => { busy = false; toast('No connection. Scan again.'); flagNext(); });
  } else if (fl.step === 'id') {
    const p = parseAAMVA(code);
    if (!p) { setGuide(['warn', 'alert', 'Not a US or Canadian ID barcode'], true); return; }
    // Got it: green check on the camera for a moment, then the "Checking for flags" screen.
    busy = true;
    const fr = $('#idf'); if (fr) fr.className = 'frame idframe got';
    const cam = $('#cam'); if (cam) cam.insertAdjacentHTML('beforeend', '<div class="gotit">' + I.check + '<span>Got it</span></div>');
    if (navigator.vibrate) navigator.vibrate(60);
    beepOk();
    setTimeout(() => { busy = false; if (mode === 'flag' && fl && fl.step === 'id') gotPerson(p); }, 650);
  }
}

/** Name + DOB from the ID (scanned or typed): check for a flag on the same person, else go to the form. */
function gotPerson(p) {
  if (fl.fixing) { fl.fixing = false; fl.person = p; fl.step = 'form'; render(); return; }
  const code = fl.code || '', photo = fl.photo || '';
  busy = true;
  fl = Object.assign(fl, { step: 'checking', via: 'id', person: p }); render();
  call('api_flagCheck', AUTH.token, { name: p.name, dob: p.dob }).then(r => {
    busy = false;
    if (!r.ok) { toast(r.msg || 'Could not check.'); fl.step = 'form'; render(); return; }
    if (r.flags.length) { fl = { step: 'found', code: code, photo: photo, via: 'id', flags: r.flags, person: p }; beepBad(); if (navigator.vibrate) navigator.vibrate([120, 80, 120]); }
    else fl = { step: 'form', code: code, photo: photo, person: p, type: '', note: '' };
    render();
  }).catch(() => { busy = false; toast('No connection. Try again.'); fl.step = 'form'; render(); });
}

function saveFlag(op, btn, msg) {
  if (btn) btn.disabled = true;
  call('api_flagSave', AUTH.token, { n: op.n || 0, type: op.type, name: op.name, dob: op.dob, note: op.note || '', platform: op.platform || '', entry: op.entry || '', code: op.code || '', photo: op.photo || '' }).then(r => {
    if (!r.ok) { toast(r.msg || 'Not saved.'); if (btn) btn.disabled = false; return; }
    fl = { step: 'saved', saved: r.flag, savedMsg: msg || '' };
    beepOk(); render();
  }).catch(() => { toast('No connection. Try again.'); if (btn) btn.disabled = false; });
}

function removeFlag(f) {
  promptBox('Remove this flag?', titleCase(f.name) + ' · ' + f.type + '. It stays on the sheet as Removed. Reason (optional):', '', 'text', 'Remove flag', v => {
    call('api_flagRemove', AUTH.token, f.n, v).then(r => { toast(r.ok ? 'Flag removed.' : (r.msg || 'Not removed.')); if (r.ok) flagStart(); })
      .catch(() => toast('No connection. Try again.'));
  }, 'red');
}

/* ============ tickets sold ============ */
function stateOf(t) {
  if (t.status === 'Void') return 'void';
  if (t.status === 'Waiting on customer') return 'pend';
  if (t.status === 'Repeat attempt' || t.repeats > 0) return 'rep';
  if (t.status === 'Scanned') return 'in';
  return 'open';
}

function renderList() {
  setTitle('Tickets Sold' + (S ? ' · ' + S.nightLabel : ''));
  const all = S ? S.tickets.slice() : [];
  const count = k => all.filter(t => k === 'all' ? stateOf(t) !== 'void' : stateOf(t) === k || (k === 'open' && stateOf(t) === 'pend')).length;
  const types = ['GA', 'VIP', 'VIP Upgrade'].map(ty => ty + ' ' + all.filter(t => t.type === ty && t.status !== 'Void').length).join(' · ');
  const chips = [['all', 'Sold', ''], ['open', 'Not scanned', '#a1a1aa'], ['in', 'Scanned', 'var(--green)'], ['rep', 'Repeat', 'var(--red)'], ['void', 'Void', '#d4d4d8']];
  const q = query.trim().toLowerCase();
  let list = all.filter(t => {
    const st = stateOf(t);
    if (filter === 'all' && st === 'void') return false;
    if (filter !== 'all' && !(st === filter || (filter === 'open' && st === 'pend'))) return false;
    if (!q) return true;
    return (t.name + ' ' + t.email + ' ' + t.n + ' ' + t.id + ' ' + t.last4 + ' ' + t.type).toLowerCase().indexOf(q) >= 0;
  });
  list.sort((a, b) => b.last - a.last);
  const prevFocus = document.activeElement && document.activeElement.id === 'q';
  $('#main').innerHTML =
    '<div class="toolbar"><label class="search">' + I.search + '<input id="q" placeholder="Search name, email, #, last 4" value="' + esc(query) + '" autocomplete="off"></label>' +
    '<div class="chips">' + chips.map(c => '<button class="fchip' + (filter === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + (c[2] ? '<i style="background:' + c[2] + '"></i>' : '') + c[1] + ' <b>' + count(c[0]) + '</b></button>').join('') + '</div></div>' +
    '<div class="typeline">' + esc(types) + '</div>' +
    (list.length ? '<div class="grid">' + list.map(cardHtml).join('') + '</div>'
      : '<div class="empty">' + (all.length ? 'No tickets match.' : '<b>No tickets sold yet tonight.</b><br>Sales from the Sell screen show up here live.') + '</div>');
  const qi = $('#q');
  qi.oninput = () => { query = qi.value; renderList(); };
  if (prevFocus) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  document.querySelectorAll('.fchip').forEach(b => { b.onclick = () => { filter = b.dataset.f; renderList(); }; });
  document.querySelectorAll('.tk').forEach(b => { b.onclick = () => openTicket(b.dataset.id); });
  list.forEach(t => { seenLast[t.id] = t.last; });
}

function cardHtml(t) {
  const st = stateOf(t);
  const admitted = t.scans.filter(s => s.res === 'Admitted')[0];
  const lastTry = t.scans.filter(s => s.res === 'Already scanned').slice(-1)[0];
  let line;
  if (st === 'void') line = 'Void';
  else if (st === 'pend') line = 'Waiting on customer · sold ' + fmtT(t.sold) + ' by ' + esc(t.by);
  else if (st === 'rep') line = 'Tried again ' + fmtT(lastTry ? lastTry.t : t.last) + (t.repeats > 1 ? ' (' + t.repeats + '×)' : '') + '<br>Scanned ' + fmtT(admitted && admitted.t) + ' by ' + esc(admitted ? admitted.by : '');
  else if (st === 'in') line = 'Scanned ' + fmtT(admitted && admitted.t) + ' by ' + esc(admitted ? admitted.by : '');
  else line = 'Not scanned · sold ' + fmtT(t.sold) + ' by ' + esc(t.by);
  const fresh = seenLast[t.id] && seenLast[t.id] !== t.last ? ' fresh' : '';
  const mailWarn = /^Failed/.test(t.mail) ? ' <span style="color:var(--red)">· email failed</span>' : '';
  return '<button class="tk ' + st + fresh + '" data-id="' + esc(t.id) + '">' +
    '<div class="top">' + tbadge(t.type) + '<span class="num">#' + t.n + '</span></div>' +
    '<div class="nm">' + esc(t.name ? titleCase(t.name) : 'No name yet') + '</div>' +
    '<div class="st">' + line + mailWarn + '</div></button>';
}

function openTicket(id) {
  const t = S && S.tickets.find(x => x.id === id);
  if (!t) return;
  const st = stateOf(t);
  const hist = ['<div class="h"><i></i><div>Sold by ' + esc(t.by) + '<small>' + fmtT(t.sold) + ' · card •••• ' + esc(t.last4) + '</small></div></div>']
    .concat(t.mail ? ['<div class="h"><i class="' + (/^Failed/.test(t.mail) ? 'r' : '') + '"></i><div>Email<small>' + esc(t.mail) + '</small></div></div>'] : [])
    .concat(t.scans.map(s => '<div class="h"><i class="' + (s.res === 'Admitted' ? 'g' : 'r') + '"></i><div>' + esc(s.res) + '<small>' + fmtTs(s.t) + ' by ' + esc(s.by) + '</small></div></div>'));
  $('#modal').innerHTML = '<div class="overlay" id="ov"><div class="sheet">' +
    '<button class="close" id="mx">' + I.x + '</button>' +
    '<div class="mname">' + esc(t.name ? titleCase(t.name) : 'No name yet') + '</div>' +
    '<div class="msub">' + tbadge(t.type) + ' &nbsp;Ticket #' + t.n + ' · ' + esc(t.status) + '</div>' +
    '<div class="kv"><div class="tr"><span>Email</span><b>' + esc(t.email || '(none)') + '</b></div>' +
    '<div class="tr"><span>Card</span><b>•••• ' + esc(t.last4) + '</b></div>' +
    '<div class="tr"><span>Code</span><b>' + esc(t.id) + '</b></div></div>' +
    '<div class="hist">' + hist.join('') + '</div>' +
    (t.notes ? '<div class="notes">' + esc(t.notes) + '</div>' : '') +
    (st === 'open' || st === 'pend' ? '<button class="bigset green" id="mIn">' + I.check + 'Check in by hand</button>' : '') +
    (st !== 'void' && t.email ? '<button class="bigset" id="mResend">' + I.mail + 'Resend email</button>' : '') +
    (st !== 'void' ? '<button class="bigset" id="mEmail">Change email</button>' : '') +
    (st !== 'void' ? '<button class="bigset red" id="mVoid">Void ticket</button>' : '') +
    '</div></div>';
  const close = () => { $('#modal').innerHTML = ''; };
  $('#mx').onclick = close;
  $('#ov').onclick = e => { if (e.target.id === 'ov') close(); };
  const b = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  b('#mIn', () => confirmBox('Check in ' + (titleCase(t.name) || 'this ticket') + '?', 'Use this when the QR won\'t scan. It counts as their one entry.', 'Check in', 'green', () => {
    call('api_scan', AUTH.token, t.id, true).then(r => { showResult(r); if (r.ticket) mergeTicket(r.ticket); }).catch(() => toast('No connection. Try again.'));
  }));
  b('#mResend', () => {
    toast('Sending…');
    call('api_resend', AUTH.token, t.id, '').then(r => { toast(r.ok ? 'Email sent to ' + t.email : (r.msg || 'Email failed')); if (r.ticket) mergeTicket(r.ticket); close(); }).catch(() => toast('No connection. Try again.'));
  });
  b('#mEmail', () => promptBox('Change email', 'The ticket is resent to the new address.', t.email, 'email', 'Save & send', v => {
    toast('Sending…');
    call('api_resend', AUTH.token, t.id, v).then(r => { toast(r.ok ? 'Email sent to ' + v : (r.msg || 'Email failed')); if (r.ticket) mergeTicket(r.ticket); }).catch(() => toast('No connection. Try again.'));
  }));
  b('#mVoid', () => promptBox('Void this ticket?', 'The QR stops working. The ticket stays in the log. Reason (optional):', '', 'text', 'Void ticket', v => {
    call('api_void', AUTH.token, t.id, v).then(r => { toast(r.ok ? 'Ticket voided' : r.msg); if (r.ticket) mergeTicket(r.ticket); }).catch(() => toast('No connection. Try again.'));
  }, 'red'));
}

function mergeTicket(t) {
  if (!S) return;
  const i = S.tickets.findIndex(x => x.id === t.id);
  if (i >= 0) S.tickets[i] = t; else if (t.night === S.night) S.tickets.push(t);
  if (mode === 'scan' && tab === 'list' && !$('#modal').innerHTML) renderList();
}

/* ============ small dialogs ============ */
function confirmBox(title, sub, okText, color, onOk) {
  $('#modal').innerHTML = '<div class="overlay"><div class="sheet"><div class="mname">' + esc(title) + '</div><div class="msub">' + esc(sub) + '</div>' +
    '<div class="row2"><button class="bigset" id="cNo">Back</button><button class="bigset ' + color + '" id="cYes">' + esc(okText) + '</button></div></div></div>';
  $('#cNo').onclick = () => { $('#modal').innerHTML = ''; };
  $('#cYes').onclick = () => { $('#modal').innerHTML = ''; onOk(); };
}
function promptBox(title, sub, value, type, okText, onOk, color) {
  $('#modal').innerHTML = '<div class="overlay"><div class="sheet"><div class="mname">' + esc(title) + '</div><div class="msub">' + esc(sub) + '</div>' +
    '<label class="field" style="margin-top:0"><input id="pIn" type="' + (type === 'email' ? 'email' : 'text') + '" autocapitalize="none" autocomplete="off" spellcheck="false" value="' + esc(value) + '"></label>' +
    '<div class="row2"><button class="bigset" id="cNo">Back</button><button class="bigset ' + (color || 'dark') + '" id="cYes">' + esc(okText) + '</button></div></div></div>';
  const inp = $('#pIn');
  setTimeout(() => inp.focus(), 50);
  $('#cNo').onclick = () => { $('#modal').innerHTML = ''; };
  $('#cYes').onclick = () => {
    const v = inp.value.trim();
    if (type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return toast('That email doesn\'t look right.');
    $('#modal').innerHTML = ''; onOk(v);
  };
}

/* ============ settings ============ */
function openSettings() {
  const draw = info => {
    $('#modal').innerHTML = '<div class="overlay" id="ov"><div class="sheet">' +
      '<button class="close" id="mx">' + I.x + '</button><div class="mname">Settings</div><div class="msub">Factory Town OnSite</div>' +
      '<div class="setrow"><span>Signed in as</span><b>' + esc(AUTH ? AUTH.name : 'Nobody') + '</b></div>' +
      '<div class="setrow"><span>Event</span><b>' + esc(info ? (info.event || 'Not set') : '…') + '</b></div>' +
      '<div class="setrow"><span>Tonight</span><b>' + esc(info ? info.night : (S ? S.nightLabel : '…')) + '</b></div>' +
      '<div class="setrow"><span>Emails left today</span><b style="' + (info && info.emailsLeft < 15 ? 'color:var(--red)' : '') + '">' + (info ? info.emailsLeft : '…') + '</b></div>' +
      '<div class="setrow"><span>Version</span><b>App ' + esc(APP_VERSION) + (info ? ' &middot; Server ' + esc(info.build) : '') + '</b></div>' +
      (AUTH ? '<button class="bigset" id="sEvent">Refresh Event</button><div class="msub" style="margin:8px 4px 0;font-size:15px">Reads the current event from the Master Timesheet. A new event gets its own flags page; flags from past events stay active.</div>' : '') +
      (AUTH && AUTH.dev ? '<button class="bigset" id="sDev">Developer</button>' : '') +
      (mode !== 'home' ? '<button class="bigset" id="sHome">Back to Home</button>' : '') +
      (AUTH ? '<button class="bigset red" id="sOut">Sign out</button>' : '') +
      '</div></div>';
    const dv = $('#sDev'); if (dv) dv.onclick = () => openDeveloper(() => draw(info));
    $('#mx').onclick = () => { $('#modal').innerHTML = ''; };
    $('#ov').onclick = e => { if (e.target.id === 'ov') $('#modal').innerHTML = ''; };
    const h = $('#sHome'); if (h) h.onclick = () => { $('#modal').innerHTML = ''; goHome(); };
    const ev = $('#sEvent'); if (ev) ev.onclick = () => {
      ev.disabled = true; ev.textContent = 'Reading the Master Timesheet…';
      call('api_refreshEvent', AUTH.token).then(r => { toast(r.msg || (r.ok ? 'Done' : 'Could not refresh'), 5000); return call('api_info', AUTH.token); })
        .then(r => { if (r && r.ok && $('#mx')) draw(r); }).catch(() => { toast('No connection. Try again.'); if ($('#sEvent')) draw(null); });
    };
    const o = $('#sOut'); if (o) o.onclick = () => confirmBox('Sign out ' + AUTH.name + '?', 'This device will ask for a code next time.', 'Sign out', 'red', () => {
      call('api_logout', AUTH.token).catch(() => {});
      AUTH = null; store.set('auth', null); goHome(); toast('Signed out');
    });
  };
  draw(null);
  if (AUTH) call('api_info', AUTH.token).then(r => { if (r.ok) setDev(r.dev); if (r.ok && $('#mx')) draw(r); }).catch(() => {});
}

/** Settings > Developer (developer codes only): turn the retired Sell and Scan back on for this device. */
function openDeveloper(back) {
  const on = sellScanOn();
  $('#modal').innerHTML = '<div class="overlay" id="ov"><div class="sheet">' +
    '<button class="close" id="mx">' + I.x + '</button><div class="mname">Developer</div><div class="msub">Only developer codes see this.</div>' +
    '<div class="setrow"><span>Sell and Scan on Home</span><b style="color:' + (on ? 'var(--green)' : 'var(--muted)') + '">' + (on ? 'On' : 'Off') + '</b></div>' +
    '<button class="bigset' + (on ? '' : ' green') + '" id="dSS">' + (on ? 'Hide Sell and Scan' : 'Show Sell and Scan') + '</button>' +
    '<div class="msub" style="margin:8px 4px 0;font-size:15px">This device only. They stay hidden for everyone else, and hide again if someone else signs in here.</div>' +
    '<div class="setrow" style="margin-top:14px"><span>ID scan diagnostics</span><b style="color:' + (idDiag() ? 'var(--green)' : 'var(--muted)') + '">' + (idDiag() ? 'On' : 'Off') + '</b></div>' +
    '<button class="bigset' + (idDiag() ? '' : ' green') + '" id="dDiag">' + (idDiag() ? 'Turn off ID scan diagnostics' : 'Turn on ID scan diagnostics') + '</button>' +
    '<div class="msub" style="margin:8px 4px 0;font-size:15px">Shows camera numbers on the ID scan screen and a Send frame button that saves what the reader sees to Drive.</div>' +
    '<button class="bigset" id="dBack">Back to Settings</button></div></div>';
  $('#dDiag').onclick = () => { store.set('devIdDiag', idDiag() ? null : true); if (mode === 'flag') render(); openDeveloper(back); };
  $('#mx').onclick = () => { $('#modal').innerHTML = ''; };
  $('#ov').onclick = e => { if (e.target.id === 'ov') $('#modal').innerHTML = ''; };
  $('#dBack').onclick = back;
  $('#dSS').onclick = () => {
    store.set('devSellScan', on ? null : true);
    if (on && (mode === 'sell' || mode === 'scan')) goHome(); else if (mode === 'home') render();
    toast(on ? 'Sell and Scan hidden' : 'Sell and Scan are on the home screen');
    openDeveloper(back);
  };
}
/** Keeps AUTH.dev current for devices that signed in before developer codes existed. */
function setDev(dev) {
  if (!AUTH || !!AUTH.dev === !!dev) return;
  AUTH.dev = !!dev; store.set('auth', AUTH);
  if (mode === 'home' || ((mode === 'sell' || mode === 'scan') && !sellScanOn())) goHome();
}
function goHome() {
  if (mode === 'sell' && sale && (sale.step === 'customer' || sale.step === 'checkmail')) return;
  mode = 'home'; sale = null; render();
}

/* ============ live updates ============ */
let polling = false;
function poll(force) {
  if (!AUTH || mode !== 'scan') return;
  if (polling) return;
  polling = true;
  call('api_getState', AUTH.token, force ? '' : (S && S.version) || '').then(r => {
    polling = false;
    if (!r.ok || r.same) return;
    S = r.state;
    if (mode === 'scan' && !$('#modal').innerHTML) {
      if (tab === 'list') renderList(); else renderScanFoot();
    }
  }).catch(() => { polling = false; });
}
setInterval(() => { if (!document.hidden) poll(false); }, 4000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (camActive()) startCamera();
});

/* ============ updates (GitHub copy) ============
 * version.txt holds the current APP_VERSION. When it changes, the app reloads itself the next time it is
 * idle (home screen or Tickets Sold), never in the middle of a sale or a scan result. */
function checkUpdate() {
  if (!HOSTED || TICKET_PARAM || document.hidden) return;
  if (!(mode === 'home' || (mode === 'scan' && tab === 'list')) || $('#modal').innerHTML || $('#result').innerHTML) return;
  fetch('version.txt?ts=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = String(v || '').trim();
    if (v && v !== APP_VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(v));
  }).catch(() => {});
}
setInterval(checkUpdate, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

/* ============ live ticket page (customer opened the link in their email) ============ */
function renderLiveTicket(v) {
  document.body.className = 'ticketpage';
  document.documentElement.style.background = '#0b0b0c';
  if (!v || !v.ok) {
    $('#main').innerHTML = '<div class="live"><img class="logo" src="' + LOGO + '" alt="Factory Town"><div class="bo">BOX OFFICE</div><div class="lt">Ticket not found</div><div class="ls">Check the link in your email, or ask the box office.</div></div>';
    return;
  }
  const c = { 'GA': '#60a5fa', 'VIP': '#fbbf24', 'VIP Upgrade': '#c084fc' }[v.type] || '#fff';
  const state = v.status === 'in' ? '<div class="lstate in">Checked in at ' + fmtT(v.inAt) + '. Enjoy the show!</div>'
    : v.status === 'void' ? '<div class="lstate void">This ticket was voided.</div>'
    : '<div class="lstate open">Show this QR code at the gate. It works once.</div>';
  $('#main').innerHTML = '<div class="live"><img class="logo" src="' + LOGO + '" alt="Factory Town"><div class="bo">BOX OFFICE</div>' +
    '<div class="lt" style="color:' + c + '">' + esc(v.type) + '</div>' +
    '<div class="ln">' + esc(titleCase(v.first)) + '</div><div class="ls">' + esc(v.night) + ' · Ticket #' + v.n + '</div>' +
    '<div class="center">' + (v.status === 'open' ? '<div class="lq">' + qrSvg(v.qr, 250) + '</div>' : '') + '</div>' +
    state + (v.type === 'VIP Upgrade' && v.status === 'open' ? '<div class="ls" style="margin-top:12px">This upgrade adds VIP access to your DICE GA ticket. Keep your DICE ticket handy too.</div>' : '') +
    '</div>';
}
function liveTicketLoop() {
  call('api_ticketView', TICKET_PARAM).then(v => {
    renderLiveTicket(v);
    if (v && v.ok && v.status === 'open') setTimeout(liveTicketLoop, 10000);
  }).catch(() => setTimeout(liveTicketLoop, 10000));
}

/* ============ start ============ */
$('#hlogo').src = LOGO;
$('#gearBtn').onclick = openSettings;
$('#homeBtn').onclick = goHome;
document.querySelectorAll('#nav button').forEach(b => { b.onclick = () => { tab = b.dataset.tab; render(); poll(false); }; });

if (TICKET_PARAM && AUTH && AUTH.token) {
  // a signed-in staff phone opened a ticket link (scanned with the phone's own camera): check it in
  mode = 'scan'; tab = 'list'; render(); poll(true);
  busy = true;
  showResult({ wait: true });
  call('api_scan', AUTH.token, TICKET_PARAM, false).then(r => { showResult(r); if (r.ticket) mergeTicket(r.ticket); })
    .catch(() => showResult({ result: 'offline', msg: 'No connection. Try again.' }));
} else if (TICKET_PARAM) {
  liveTicketLoop();
} else {
  render();
  if (AUTH && AUTH.token && !HAS_GAS) call('api_info', AUTH.token).then(r => { if (r.ok) setDev(r.dev); }).catch(() => {});
}
</script>
</body>
